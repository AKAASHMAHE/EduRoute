{% extends "base.html" %}

{% block title %}Page Not Found - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 text-primary fw-bold mb-3">404</div>
        <h3 class="fw-bold text-dark mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">
            The page or journey record you requested could not be found. It may have been moved or deleted.
        </p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-lg shadow-sm">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
