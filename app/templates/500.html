{% extends "base.html" %}

{% block title %}Server Error - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 text-danger fw-bold mb-3">500</div>
        <h3 class="fw-bold text-dark mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. Please try again or return to the dashboard.
        </p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-lg shadow-sm">
            <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
