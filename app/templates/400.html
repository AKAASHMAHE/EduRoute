{% extends "base.html" %}

{% block title %}Bad Request - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="display-1 text-warning fw-bold mb-3">400</div>
        <h3 class="fw-bold text-dark mb-3">Bad Request</h3>
        <p class="text-muted mb-4">
            {{ error or "The request could not be processed due to invalid parameters or missing CSRF token." }}
        </p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-lg shadow-sm">
            <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
